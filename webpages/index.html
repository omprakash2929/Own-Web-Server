<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Python Web Server</title>
    <link rel="stylesheet" href="static/style.css">
  
</head>

<body>

<div class="container">

    <h1>🚀 My Python Web Server</h1>

    <p>
        Welcome! This webpage is being served from my own HTTP server

    </p>

    <div class="status">
        ✅ Server Status: Running
    </div>

    <div class="info">

        <div class="card">
            <h3>🌐 Protocol</h3>
            <p>HTTP/1.1</p>
        </div>

        <div class="card">
            <h3>🐍 Language</h3>
            <p>Python</p>
        </div>

        <div class="card">
            <h3>⚡ Built With</h3>
            <p>Socket Programming</p>
        </div>

        <div class="card">
            <h3>📂 File Served</h3>
            <p><code>index.html</code></p>
        </div>

    </div>

    <footer>
        Built with ❤️ by Omprakash Chauhan
    </footer>

</div>

</body>
</html>
