<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Python Web Server</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        p {
            font-size: 1.2rem;
            color: #d1d5db;
            margin-bottom: 30px;
        }

        .status {
            display: inline-block;
            padding: 12px 25px;
            background: #22c55e;
            color: white;
            border-radius: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.15);
        }

        .card h3 {
            color: #38bdf8;
            margin-bottom: 10px;
        }

        footer {
            margin-top: 35px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        code {
            color: #facc15;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚀 My Python Web Server</h1>

    <p>
        Welcome! This webpage is being served from my own HTTP server
        built using <strong>Python Socket Programming</strong>.
    </p>

    <div class="status">
        ✅ Server Status: Running
    </div>

    <div class="info">

        <div class="card">
            <h3>🌐 Protocol</h3>
            <p>HTTP/1.1</p>
        </div>

        <div class="card">
            <h3>🐍 Language</h3>
            <p>Python</p>
        </div>

        <div class="card">
            <h3>⚡ Built With</h3>
            <p>Socket Programming</p>
        </div>

        <div class="card">
            <h3>📂 File Served</h3>
            <p><code>index.html</code></p>
        </div>

    </div>

    <footer>
        Built with ❤️ by Omprakash Chauhan
    </footer>

</div>

</body>
</html>
